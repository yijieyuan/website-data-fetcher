# Project name pinned so it does not follow the folder name (fetchers/scholar-kaggle).
name: website-data-fetcher

services:
  website-python-fetcher:
    image: python:3.11-slim
    container_name: website-python-fetcher
    restart: always
    volumes:
      - ./src:/app/src
      # Pinned package versions, installed by the command below
      - ./requirements.txt:/app/requirements.txt:ro
      # Current files go to data/public (the website reads them); superseded
      # versions are archived to data/private, which the website cannot see.
      - ../../data/public:/app/data
      - ../../data/private/archive:/app/archive
    environment:
      - ARCHIVE_DIR=/app/archive
    working_dir: /app
    env_file:
      - .env
    # Versions are pinned in requirements.txt (bibtexparser must stay below 2,
    # see the note there). Do not install by bare package name here: a newly
    # created container would get whatever is newest that day.
    command: >
      sh -c "pip install -r requirements.txt && python -u src/manager.py"